<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#07111f">
    <title>Sin conexión · Stelfaro</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f8fc;color:#0f172a;font-family:system-ui,-apple-system,sans-serif;padding:24px}.card{width:min(100%,420px);border:1px solid #dbe5f0;border-radius:20px;background:#fff;padding:28px;box-shadow:0 18px 50px #0f172a14}.mark{display:grid;width:52px;height:52px;place-items:center;border-radius:16px;background:#e0f2fe;color:#0369a1;font-size:24px;font-weight:900}h1{margin:20px 0 8px;font-size:24px}p{margin:0;color:#64748b;line-height:1.55}button{width:100%;min-height:52px;margin-top:24px;border:0;border-radius:14px;background:#0284c7;color:#fff;font-weight:750;font-size:16px} @media(prefers-color-scheme:dark){body{background:#07111f;color:#f8fafc}.card{background:#101c2d;border-color:#26364b}p{color:#9fb0c4}}
    </style>
</head>
<body>
    <main class="card">
        <div class="mark">S</div>
        <h1>Sin conexión</h1>
        <p>Stelfaro necesita conexión para proteger y sincronizar la información de facturación. Revisa tu red e inténtalo nuevamente.</p>
        <button type="button" onclick="location.reload()">Volver a intentar</button>
    </main>
</body>
</html>
